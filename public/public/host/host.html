<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Classroom Arcade - Host View</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card" id="host-lobby">
    <h1>Host Dashboard</h1>
    <button id="create-btn" onclick="createGame()">Create Game Room</button>
    <div id="lobby-info" class="hidden">
      <p>Join Code:</p>
      <h2 id="display-code" style="font-size:2.5rem; color:#2563eb;">------</h2>
      <h3>Joined Players:</h3>
      <ul id="player-list"></ul>
      <button onclick="startGame()">Start Game</button>
    </div>
  </div>

  <div class="card hidden" id="host-scoreboard">
    <h2>Live Leaderboard</h2>
    <ul id="leaderboard"></ul>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
