<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Classroom Arcade - Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="join-screen" class="container">
    <h1>Classroom Arcade</h1>
    <input id="pin-input" type="text" placeholder="6-Digit Game PIN" maxlength="6">
    <input id="nick-input" type="text" placeholder="Your Nickname">
    <button onclick="joinGame()">Join Game</button>
  </div>

  <div id="game-screen" class="container" style="display:none;">
    <div class="header">
      <span id="player-nick"></span> | Gold: <strong id="gold-count">0</strong>
    </div>
    <div id="question-card">
      <h2 id="q-text">Loading question...</h2>
      <div id="answers-grid"></div>
    </div>

    <!-- Mystery Chest Modal -->
    <div id="chest-overlay" style="display:none;">
      <h2>Correct! Pick a Mystery Chest:</h2>
      <div class="chest-container">
        <button class="chest-btn" onclick="pickChest(0)">🧰 Chest 1</button>
        <button class="chest-btn" onclick="pickChest(1)">🧰 Chest 2</button>
        <button class="chest-btn" onclick="pickChest(2)">🧰 Chest 3</button>
      </div>
      <h3 id="chest-result"></h3>
      <button id="next-q-btn" style="display:none;" onclick="loadNextQuestion()">Next Question</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
