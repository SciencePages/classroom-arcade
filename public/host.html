<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Classroom Arcade - Host</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="max-width: 600px;">
    <h1>Host Dashboard</h1>
    <button onclick="createRoom()" style="background: #6200ee; font-size: 18px;">Create Game Room</button>
    
    <div style="margin: 20px 0;">
      <h2>Join Code:</h2>
      <h1 id="game-pin" style="font-size: 52px; color: #52b788; letter-spacing: 6px; margin: 10px 0;">------</h1>
    </div>

    <button id="start-btn" onclick="startGame()" style="background: #2a9d8f; font-size: 20px; display: none; margin-bottom: 20px;">▶ Start Game</button>

    <h2 style="border-bottom: 2px solid #3d405b; padding-bottom: 10px;">Joined Players</h2>
    <div id="player-list" style="text-align: left; margin-top: 15px;">
      <p style="color: #888; text-align: center;">No players joined yet...</p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentPin = '';

    function createRoom() {
      socket.emit('create-room');
    }

    socket.on('room-created', (pin) => {
      currentPin = pin;
      document.getElementById('game-pin').innerText = pin;
      document.getElementById('start-btn').style.display = 'block';
    });

    function startGame() {
      if (currentPin) {
        socket.emit('start-game', { pin: currentPin });
        document.getElementById('start-btn').innerText = 'Game in Progress...';
        document.getElementById('start-btn').disabled = true;
        document.getElementById('start-btn').style.background = '#4a4e69';
      }
    }

    socket.on('update-players', (players) => {
      const list = document.getElementById('player-list');
      list.innerHTML = '';
      
      const sorted = Object.values(players).sort((a, b) => b.gold - a.gold);

      if (sorted.length === 0) {
        list.innerHTML = '<p style="color: #888; text-align: center;">No players joined yet...</p>';
        return;
      }

      sorted.forEach((p, index) => {
        const item = document.createElement('div');
        item.style.cssText = 'padding: 12px; margin: 8px 0; background: #2a2a32; border-radius: 6px; display: flex; justify-content: space-between; font-size: 20px; font-weight: bold;';
        
        let medal = `#${index + 1}`;
        if (index === 0) medal = '🥇 1st';
        if (index === 1) medal = '🥈 2nd';
        if (index === 2) medal = '🥉 3rd';

        item.innerHTML = `<span>${medal} ${p.nickname}</span> <span style="color: #f4a261;">💰 ${p.gold} Gold</span>`;
        list.appendChild(item);
      });
    });
  </script>
</body>
</html>
